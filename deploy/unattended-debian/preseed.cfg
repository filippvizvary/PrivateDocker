### Debian unattended install preseed template for HomeStack
### Edit placeholders before use.

# Locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string homestack
d-i netcfg/get_domain string local

# Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Accounts
# Disable direct root login and create a sudo user.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string HomeStack Admin
d-i passwd/username string filip
# Replace with: openssl passwd -6
d-i passwd/user-password-crypted password $6$REPLACE_WITH_HASH

# Clock and timezone
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitioning (single disk, guided)
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Packages
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo openssh-server curl wget ca-certificates git gnupg lsb-release python3 python3-venv python3-pip sqlite3
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# Finish install + first boot automation
# HOST_IP must serve files from deploy/unattended-debian:
#   homestack-firstboot.sh
#   homestack-firstboot.service
#   bootstrap.env
# Example host command:
#   cd deploy/unattended-debian && cp bootstrap.env.example bootstrap.env && python3 -m http.server 8000
# Then set installer boot params:
#   auto=true priority=critical preseed/url=http://HOST_IP:8000/preseed.cfg

d-i preseed/late_command string \
  in-target install -d -m 0755 /usr/local/sbin; \
  in-target install -d -m 0755 /etc/systemd/system; \
  in-target install -d -m 0700 /etc/homestack; \
  in-target sh -c 'wget -qO /usr/local/sbin/homestack-firstboot.sh http://HOST_IP:8000/homestack-firstboot.sh'; \
  in-target sh -c 'wget -qO /etc/systemd/system/homestack-firstboot.service http://HOST_IP:8000/homestack-firstboot.service'; \
  in-target sh -c 'wget -qO /etc/homestack/bootstrap.env http://HOST_IP:8000/bootstrap.env'; \
  in-target chmod 0755 /usr/local/sbin/homestack-firstboot.sh; \
  in-target chmod 0600 /etc/homestack/bootstrap.env; \
  in-target systemctl enable homestack-firstboot.service

d-i finish-install/reboot_in_progress note
